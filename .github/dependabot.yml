version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    # Flutter 3.44.7 / Dart 3.12.2 cannot resolve these published releases.
    # Remove after the compatible SDK upgrade in issue #114.
    ignore:
      - dependency-name: test
        versions: ['1.31.1', '1.31.2', '1.32.0', '1.33.0']
      - dependency-name: intl
        versions: ['0.20.3']
      - dependency-name: sodium
        versions: ['4.1.0', '4.1.2']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
