name: Artifact download compatibility

on:
  pull_request:
    paths:
      - .github/workflows/artifact-download.yml
      - .github/workflows/release.yml
      - test/tool/github_release_workflow_test.dart
  push:
    branches:
      - master
    paths:
      - .github/workflows/artifact-download.yml
      - .github/workflows/release.yml
      - test/tool/github_release_workflow_test.dart
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-download-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-download:
    name: Verify artifact upload and download
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare non-sensitive artifact fixtures
        shell: bash
        run: |
          mkdir -p expected/metadata expected/android
          printf 'commit_sha=%s\n' "$GITHUB_SHA" > expected/metadata/release-metadata.txt
          printf 'artifact-download-fixture\000\377\n' > expected/android/app-release.aab

      - name: Upload metadata fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: expected/metadata/release-metadata.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload Android fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: expected/android/app-release.aab
          if-no-files-found: error
          retention-days: 1

      - name: Download metadata fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded/metadata

      - name: Download Android fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded/android

      - name: Verify downloaded bytes and paths
        shell: bash
        run: |
          cmp expected/metadata/release-metadata.txt downloaded/metadata/release-metadata.txt
          cmp expected/android/app-release.aab downloaded/android/app-release.aab
