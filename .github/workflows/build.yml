name: Platform builds

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - .github/workflows/build.yml
      - .fvmrc
      - pubspec.yaml
      - pubspec.lock
      - assets/**
      - lib/**
      - android/**
      - ios/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: bash scripts/build_android.sh debug-apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-sw-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  ios:
    name: iOS unsigned debug app
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned debug app
        run: bash scripts/build_ios.sh unsigned-debug

      - name: Upload iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-sw-ios-unsigned-debug-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 90
